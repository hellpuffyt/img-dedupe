[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "img-dedupe"
version = "0.1.0"
description = "Find near-duplicate images by perceptual hash, cluster them, and produce a review manifest before anything is deleted."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prabesh Sharma" }]
keywords = [
    "perceptual-hash",
    "image-deduplication",
    "phash",
    "dhash",
    "ahash",
    "image-processing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/hellpuffyt/img-dedupe"

[project.scripts]
img-dedupe = "img_dedupe.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
img_dedupe = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["N818"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true
